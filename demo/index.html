<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DuckDB → Martin-style MVT — Singapore Flood Sensors</title>

  <!-- MapLibre GL JS from CDN -->
  <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>

  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      background: rgba(255,255,255,0.92); padding: 10px 14px; border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.25); max-width: 320px; font-size: 13px;
    }
    .panel h1 { font-size: 15px; margin: 0 0 6px; }
    .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
                   margin-right: 5px; vertical-align: middle; }
    .maplibregl-popup-content { font-size: 12px; }
    code { background:#eee; padding:1px 4px; border-radius:3px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>Singapore Flood Sensors</h1>
    <div>MVT tiles served live from <strong>DuckDB spatial</strong> via a
      Martin-style backend. TileJSON auto-configures this map.</div>
    <div class="legend" style="margin-top:8px;">
      <div><span style="background:#2c7fb8"></span>normal</div>
      <div><span style="background:#fdae61"></span>elevated</div>
      <div><span style="background:#d7191c"></span>flood-warning</div>
    </div>
    <div style="margin-top:8px; color:#666;">
      TileJSON: <code id="tj"></code>
    </div>
  </div>

  <script>
    // Point at the tile server's TileJSON; the source name matches config.yaml.
    const SERVER = location.protocol.startsWith("http")
      ? location.origin.replace(/:\d+$/, "") + ":3000"
      : "http://localhost:3000";
    const TILEJSON_URL = SERVER + "/sg_rainfall";
    document.getElementById("tj").textContent = TILEJSON_URL;

    const map = new maplibregl.Map({
      container: "map",
      // A minimal raster basemap (OSM) so points have context. The vector
      // sensor layer comes from our DuckDB tile server.
      style: {
        version: 8,
        sources: {
          osm: {
            type: "raster",
            tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
            tileSize: 256,
            attribution: "© OpenStreetMap contributors",
          },
        },
        layers: [{ id: "osm", type: "raster", source: "osm" }],
      },
      center: [103.84, 1.34],
      zoom: 11,
    });

    map.addControl(new maplibregl.NavigationControl());

    map.on("load", () => {
      // Add the DuckDB MVT source via TileJSON (MapLibre fetches it for us).
      map.addSource("sensors", { type: "vector", url: TILEJSON_URL });

      // The MVT layer id ("source-layer") matches `layer_name` in config.yaml.
      const SOURCE_LAYER = "rainfall";

      map.addLayer({
        id: "sensor-points",
        type: "circle",
        source: "sensors",
        "source-layer": SOURCE_LAYER,
        paint: {
          "circle-radius": [
            "interpolate", ["linear"], ["get", "water_level_m"],
            0, 4, 2, 12,
          ],
          "circle-color": [
            "match", ["get", "status"],
            "flood-warning", "#d7191c",
            "elevated", "#fdae61",
            /* default */ "#2c7fb8",
          ],
          "circle-stroke-color": "#ffffff",
          "circle-stroke-width": 1.2,
          "circle-opacity": 0.9,
        },
      });

      // Click popup with sensor details.
      map.on("click", "sensor-points", (e) => {
        const p = e.features[0].properties;
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(
            `<strong>${p.name}</strong><br/>` +
            `id: ${p.station_id}<br/>` +
            `rainfall: ${p.rainfall_mm} mm/hr<br/>` +
            `water level: ${p.water_level_m} m<br/>` +
            `status: <strong>${p.status}</strong>`
          )
          .addTo(map);
      });
      map.on("mouseenter", "sensor-points", () => (map.getCanvas().style.cursor = "pointer"));
      map.on("mouseleave", "sensor-points", () => (map.getCanvas().style.cursor = ""));
    });

    map.on("error", (e) => console.error("map error:", e && e.error));
  </script>
</body>
</html>
